<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Achievements Awards 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a;--gold:#d8b25a;--gold2:#f7e3a1;--gold3:#8a6a25;--ivory:#f6efdf;--glass:rgba(255,248,225,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ivory);font-family:Montserrat,system-ui,sans-serif;font-weight:300}
body{background:radial-gradient(ellipse at 50% -10%,#2a2010 0,#0b0910 45%,#050407 100%) fixed}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.gold{background:linear-gradient(100deg,var(--gold3),var(--gold2) 30%,var(--gold) 50%,var(--gold2) 70%,var(--gold3));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.view{display:none;position:relative;z-index:2;min-height:100%}.view.on{display:block}
.wrap{max-width:560px;margin:0 auto;padding:44px 24px 60px;text-align:center}
.eyebrow{letter-spacing:.5em;font-size:11px;color:var(--gold);text-transform:uppercase}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(38px,9vw,64px);line-height:1;margin:18px 0 14px;letter-spacing:.04em}
.sub{opacity:.75;line-height:1.7;font-size:14px}
.rule{height:1px;width:140px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.panel{background:var(--glass);border:1px solid rgba(216,178,90,.28);border-radius:4px;padding:26px;backdrop-filter:blur(14px);box-shadow:0 0 60px rgba(216,178,90,.08),inset 0 0 40px rgba(216,178,90,.03);text-align:left}
label{display:block;font-size:11px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin:18px 0 8px}
.q{font-family:'Cormorant Garamond',serif;font-size:24px;font-style:italic;text-align:center;color:var(--gold2);margin:4px 0 10px}
input,textarea{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(216,178,90,.35);color:var(--ivory);padding:14px;font:inherit;font-size:16px;border-radius:2px;outline:none}
input:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 18px rgba(216,178,90,.3)}
textarea{min-height:120px;resize:vertical}
.btn{cursor:pointer;border:1px solid var(--gold);background:linear-gradient(135deg,#8a6a25,#f7e3a1 50%,#b88a35);color:#1a1205;font:600 12px Montserrat;letter-spacing:.25em;text-transform:uppercase;padding:16px 22px;border-radius:2px;width:100%;margin-top:24px;transition:.25s}
.btn:hover{filter:brightness(1.12);box-shadow:0 0 30px rgba(216,178,90,.5)}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--gold2);width:auto;margin:0;padding:11px 16px}
.err{color:#ff9d8a;font-size:13px;margin-top:12px;min-height:18px}
.conf{padding-top:12vh;text-align:center}.conf h1{font-size:clamp(40px,11vw,76px)}
/* admin */
.adm{max-width:1000px;margin:0 auto;padding:32px 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.stat{padding:18px;text-align:center}.stat b{display:block;font:700 40px 'Cormorant Garamond';color:var(--gold2)}.stat span{font-size:10px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}
.bar input{flex:1;min-width:180px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10px;letter-spacing:.2em;color:var(--gold);text-align:left;text-transform:uppercase}
td,th{padding:10px 8px;border-bottom:1px solid rgba(216,178,90,.15);vertical-align:top}.win td{color:var(--gold2)}
/* stage */
#stage{height:100%;overflow:hidden;text-align:center}
#stage.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s;padding:4vw}.sc.on{opacity:1;pointer-events:auto}
.big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(40px,9vw,150px);line-height:1;letter-spacing:.05em}
.mid{font:italic 400 clamp(20px,3vw,44px) 'Cormorant Garamond';color:var(--gold2);letter-spacing:.1em}
.sphere{width:min(46vh,46vw);height:min(46vh,46vw);border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(255,240,190,.35),rgba(216,178,90,.12) 45%,rgba(20,14,4,.7));border:1px solid rgba(247,227,161,.5);box-shadow:0 0 80px rgba(216,178,90,.45),inset 0 0 80px rgba(216,178,90,.2);animation:pulse 2.4s ease-in-out infinite}
.sphere.fast{animation-duration:.5s}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 140px rgba(247,227,161,.7),inset 0 0 90px rgba(216,178,90,.35)}}
#roul{font:600 clamp(22px,3.4vw,48px) 'Cormorant Garamond';color:var(--gold2);max-width:80%;text-shadow:0 0 20px rgba(216,178,90,.8)}
.cnt{position:absolute;top:3vh;left:0;right:0;font-size:clamp(12px,1.4vw,20px);letter-spacing:.6em;color:var(--gold)}
#flash{position:fixed;inset:0;background:#fff6d0;opacity:0;pointer-events:none;z-index:5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;width:min(92vw,1300px);margin-top:3vh}
.frame{border:1px solid var(--gold);padding:1.6vw 1vw;background:linear-gradient(160deg,rgba(216,178,90,.14),rgba(0,0,0,.5));box-shadow:0 0 30px rgba(216,178,90,.3),inset 0 0 0 5px #07060a,inset 0 0 0 6px rgba(216,178,90,.5);opacity:0;transform:translateY(30px) scale(.95);animation:rise .9s forwards}
.frame i{font:600 clamp(11px,1.2vw,18px) Montserrat;font-style:normal;letter-spacing:.3em;color:var(--gold)}.frame div{font:700 clamp(18px,2.4vw,38px) 'Cormorant Garamond';margin-top:.6vw;color:var(--gold2)}
@keyframes rise{to{opacity:1;transform:none}}
.ctl{position:fixed;bottom:14px;right:14px;z-index:6;display:flex;gap:8px;opacity:.35;transition:.3s}.ctl:hover{opacity:1}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:4;font-size:11px;letter-spacing:.3em;color:var(--gold);opacity:.7;pointer-events:none}
</style></head><body><canvas id="fx"></canvas><div id="flash"></div>

<section class="view on"><div class="wrap" id="regwrap">
<div class="eyebrow">Exclusive Gala</div><h1 class="gold">ACHIEVEMENTS AWARDS 2026</h1>
<p class="sub">Celebrate your journey. Share your achievements. Be part of something extraordinary.</p><div class="rule"></div>
<div class="q">What's your biggest achievements this year?</div>
<div class="panel"><label for="nm">Full Name</label><input id="nm" maxlength="80" placeholder="Enter your full name" autocomplete="name">
<label for="ac">Biggest Achievement This Year</label><textarea id="ac" maxlength="600" placeholder="Share the achievement you're most proud of..."></textarea>
<div class="err" id="rerr"></div><button class="btn" id="rsub">Enter the grand prize draw</button></div></div>
<div class="wrap conf" id="conf" style="display:none"><div class="eyebrow">Confirmed</div><h1 class="gold">YOU'RE OFFICIALLY IN!</h1><div class="rule"></div><p class="sub">Your entry has been successfully registered. Good luck!</p><p class="sub" id="pid" style="color:var(--gold);letter-spacing:.2em"></p></div></section>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbxbMEksLuGfTysnaQBZ9AekYty_MAXKiYx8sD2oWAq7F2Gr_2xdndltnMi_UqSCjqo/exec";
const $=s=>document.querySelector(s);
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[],R=[];
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};addEventListener('resize',rs);rs();
for(let i=0;i<70;i++)P.push({x:Math.random()*2e3,y:Math.random()*1200,r:Math.random()*1.8+.4,v:Math.random()*.3+.1,a:Math.random()*6});
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*7+2;R.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:45+Math.random()*15,c:0})}}
function confetti(n){for(let i=0;i<n;i++)R.push({x:Math.random()*W,y:-20,vx:Math.random()*2-1,vy:Math.random()*3+2,l:2,h:38+Math.random()*20,c:1,w:Math.random()*8+4})}
function celebrate(){burst(W/2,H/3,90);confetti(90);setTimeout(()=>burst(W*.3,H*.4,60),300);setTimeout(()=>burst(W*.7,H*.35,60),600)}
function loop(t){cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
 for(const p of P){p.y-=p.v;p.x+=Math.sin(t/2e3+p.a)*.2;if(p.y<-5)p.y=H+5;cx.fillStyle=`rgba(247,227,161,${.25+.25*Math.sin(t/700+p.a)})`;cx.beginPath();cx.arc(p.x%W,p.y%H,p.r,0,6.283);cx.fill()}
 for(let i=R.length-1;i>=0;i--){const r=R[i];r.x+=r.vx;r.y+=r.vy;if(r.c){r.vx+=Math.sin(r.y/30)*.05;r.l-=.004}else{r.vy+=.08;r.vx*=.98;r.l-=.014}
  if(r.l<=0||r.y>H+30){R.splice(i,1);continue}cx.fillStyle=`hsla(${r.h},90%,65%,${Math.min(1,r.l)})`;if(r.c)cx.fillRect(r.x,r.y,r.w,r.w*.5);else{cx.beginPath();cx.arc(r.x,r.y,2,0,6.283);cx.fill()}}
 cx.globalCompositeOperation='source-over';requestAnimationFrame(loop)}requestAnimationFrame(loop);
const rid=()=>{const a=new Uint8Array(5);crypto.getRandomValues(a);return'AA26-'+[...a].map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('')};
function done(p){$('#regwrap').style.display='none';$('#conf').style.display='block';$('#pid').textContent='ENTRY '+p;celebrate()}
try{const p=localStorage.getItem('aa26');if(p)done(p)}catch(e){}
$('#rsub').onclick=async()=>{
 const name=$('#nm').value.trim().replace(/\s+/g,' '),ach=$('#ac').value.trim(),er=$('#rerr');er.textContent='';
 if(name.length<4||!name.includes(' '))return er.textContent='Please enter your full name (first and last).';
 if(ach.length<10)return er.textContent='Please share your achievement (at least a short sentence).';
 $('#rsub').disabled=true;const p=rid();
 try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id:p,name,achievement:ach})});
  try{localStorage.setItem('aa26',p)}catch(e){}done(p)}
 catch(e){er.textContent='Connection problem. Please try again.';$('#rsub').disabled=false}};
</script></body></html>
